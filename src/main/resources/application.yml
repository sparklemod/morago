spring:
  profiles:
    active: s3,dev # Переключение s3/local и dev/prod

  config:
    import: optional:file:.env[.properties]

  application:
    name: morago-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: false
    url: ${DATABASE_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    baselineOnMigrate: true
    validateMigrationNaming: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  calendly: https://calendly.com/

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true