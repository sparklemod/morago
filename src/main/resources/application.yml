spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: morago-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: false
    url: ${DATABASE_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    baselineOnMigrate: true
    validateMigrationNaming: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  secret: your-very-secure-secret-key-1234567890
  expiration: 86400000

file:
  upload-dir: ./uploads
  storage:
    type: local
    # Для S3 (раскомментировать и настроить):
    # aws:
    #   s3:
    #     bucket: morago-bucket
    #     region: us-east-1
    #     access-key: your-access-key
    #     secret-key: your-secret-key