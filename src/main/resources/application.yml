spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: morago-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: false
    url: ${DATABASE_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    baselineOnMigrate: true
    validateMigrationNaming: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  secret: your-very-secure-secret-key-1234567890
  expiration: 86400000

file:
  upload-dir: ./uploads
  storage:
    type: s3 # переключение на s3 с local
    aws:
      s3:
        bucket: morago-files
        region: ap-northeast-2
